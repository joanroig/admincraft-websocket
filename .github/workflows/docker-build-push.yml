name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  # Allows manual workflow runs from the Actions tab
  workflow_dispatch:

# Add permissions needed for creating releases and pushing to GHCR
permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            joanroig/admincraft-websocket:latest
            joanroig/admincraft-websocket:${{ steps.package-version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/admincraft-websocket:latest
            ghcr.io/${{ github.repository_owner }}/admincraft-websocket:${{ steps.package-version.outputs.version }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          release_name: Release v${{ steps.package-version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            Release v${{ steps.package-version.outputs.version }}
            
            Docker images available at:
            - Docker Hub: `joanroig/admincraft-websocket:${{ steps.package-version.outputs.version }}`
            - GitHub Packages: `ghcr.io/${{ github.repository_owner }}/admincraft-websocket:${{ steps.package-version.outputs.version }}`
